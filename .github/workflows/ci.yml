name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Control contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON and manifest digests
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("portfolio-contracts")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          for section in ("schemas", "generated"):
              for relative, expected in manifest[section].items():
                  path = root / relative
                  assert path.is_file(), f"missing contract artifact: {path}"
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert actual == expected, f"digest mismatch: {path}"
          for path in root.glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("Contract manifest and JSON: OK")
          PY
      - name: Validate generated runtimes
        run: |
          python -m compileall -q portfolio-contracts/generated/python
          node --check portfolio-contracts/generated/javascript/validators.js
          node --check portfolio-contracts/generated/javascript/validators.cjs
      - name: Verify profile essentials
        run: |
          test -s README.md
          test -s assets/profile-banner.svg
