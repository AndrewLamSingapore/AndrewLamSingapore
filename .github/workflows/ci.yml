name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Control contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Validate contract manifest and JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("portfolio-contracts")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          digest = re.compile(r"^[0-9a-f]{64}$")
          assert manifest["contract_version"] == "2.0.0"
          for section in ("schemas", "generated"):
              assert manifest[section], f"empty manifest section: {section}"
              for relative, expected in manifest[section].items():
                  path = root / ("schemas" if section == "schemas" else "") / relative
                  assert path.is_file(), f"missing contract artifact: {path}"
                  assert digest.fullmatch(expected), f"invalid SHA-256 entry: {relative}"
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("Contract manifest and JSON: OK")
          PY
      - name: Validate generated runtimes
        run: |
          python -m compileall -q portfolio-contracts/generated/python
          node --check portfolio-contracts/generated/javascript/validators.js
          node --check portfolio-contracts/generated/javascript/validators.cjs
      - name: Verify profile essentials
        run: |
          test -s README.md
          test -s assets/profile-banner.svg
