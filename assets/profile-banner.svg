<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Andrew Lam — Operations Intelligence</title>
  <desc id="desc">Earlier signals and better decisions, built from more than twenty years of operating experience.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="0.55" stop-color="#0a2331"/>
      <stop offset="1" stop-color="#103947"/>
    </linearGradient>
    <radialGradient id="signal" cx="76%" cy="43%" r="48%">
      <stop offset="0" stop-color="#42d7d0" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#42d7d0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#42d7d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#9ddbd8" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#background)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#signal)"/>

    <path d="M 0 292 C 235 254 315 333 510 292 S 790 239 1200 271" fill="none" stroke="#43d6cf" stroke-width="2" stroke-opacity="0.34"/>
    <path d="M 0 310 C 226 275 335 342 516 310 S 846 271 1200 294" fill="none" stroke="#f2b84b" stroke-width="2" stroke-opacity="0.26"/>

    <g transform="translate(922 148)" fill="none">
      <circle r="104" stroke="#79ded9" stroke-width="1.4" stroke-opacity="0.18"/>
      <circle r="75" stroke="#79ded9" stroke-width="1.4" stroke-opacity="0.25"/>
      <circle r="44" stroke="#79ded9" stroke-width="1.4" stroke-opacity="0.4"/>
      <path d="M -104 0 H 104 M 0 -104 V 104" stroke="#79ded9" stroke-width="1" stroke-opacity="0.14"/>
      <path d="M 0 0 L 79 -57" stroke="#42d7d0" stroke-width="2" stroke-opacity="0.62"/>
      <circle cx="79" cy="-57" r="5" fill="#f2b84b" stroke="#f2b84b" filter="url(#glow)"/>
      <circle cx="-43" cy="31" r="4" fill="#42d7d0" stroke="#42d7d0" filter="url(#glow)"/>
      <circle cx="23" cy="69" r="3.5" fill="#42d7d0" stroke="#42d7d0" filter="url(#glow)"/>
      <circle r="6" fill="#42d7d0" stroke="#b8f7f4" stroke-width="2" filter="url(#glow)"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="68" y="72" fill="#71ddd8" font-size="17" font-weight="700" letter-spacing="4.4">OPERATIONS × DATA × GOVERNED AI</text>
      <text x="64" y="151" fill="#f5fafc" font-size="62" font-weight="760" letter-spacing="-1.8">ANDREW LAM</text>
      <text x="68" y="203" fill="#d8e8ed" font-size="27" font-weight="500">Operations intelligence built from real experience.</text>
      <text x="68" y="246" fill="#9db6c1" font-size="21" font-weight="450">Earlier signals. Better decisions. Evidence before promise.</text>
      <text x="68" y="307" fill="#f2b84b" font-size="14" font-weight="700" letter-spacing="3.2">SINGAPORE  ·  BUILDING IN PUBLIC</text>
    </g>

    <rect x="0" y="0" width="8" height="340" fill="#42d7d0"/>
    <rect x="8" y="0" width="3" height="340" fill="#f2b84b" opacity="0.9"/>
  </g>
</svg>
